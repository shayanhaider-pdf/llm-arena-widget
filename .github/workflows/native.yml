name: Native iPhone and iPad validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'native/**'
      - 'data/widget.json'
      - 'data/access.json'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test the app and embedded widget on an iPhone simulator
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          device=$(xcrun simctl list devices available --json | python3 -c '
          import json
          import sys

          major = sys.argv[1].split(".")[0]
          runtime_prefix = f"com.apple.CoreSimulator.SimRuntime.iOS-{major}-"
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted(
              (key for key in runtimes if key.startswith(runtime_prefix)),
              key=lambda key: tuple(map(int, key.split(".iOS-")[1].split("-"))),
              reverse=True,
          )
          for runtime in ios:
              for device in runtimes[runtime]:
                  if device["isAvailable"] and device["name"].startswith("iPhone "):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit(f"No available iPhone simulator for iOS {major}.")
          ' "$sdk")
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcodebuild -project native/AIRadar.xcodeproj -scheme AIRadar \
            -destination "platform=iOS Simulator,id=$device" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
