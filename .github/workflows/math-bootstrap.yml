name: Retrieve official Math data for category expansion
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/math-bootstrap.yml']
permissions:
  contents: read
jobs:
  math-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'huggingface_hub>=0.28,<2' 'pyarrow>=18,<24'
      - name: Read exact official Math rows
        run: |
          python - <<'PY'
          import datetime as dt, json
          from refresh import discover, parquet_rows, norm, SOURCE
          revision, available = discover()
          rows = parquet_rows(available['text_style_control'], revision)
          print('SOURCE_CATEGORIES '+json.dumps(sorted({norm(r.get('category') or 'overall') for r in rows})))
          candidates = [r for r in rows if norm(r.get('category') or 'overall') in {'math', 'mathematics'} and r.get('rank') is not None]
          assert candidates, 'No official Math rankings in downloadable text_style_control'
          date = max(str(r['leaderboard_publish_date'])[:10] for r in candidates)
          models = {}
          for r in candidates:
              if str(r['leaderboard_publish_date'])[:10] != date: continue
              model = {'id':r['model_name'], 'rank':int(r['rank'])}
              key = model['id'].strip().casefold()
              assert model['rank'] > 0 and model['rank'] == float(r['rank'])
              assert key not in models or models[key]['rank'] == model['rank'], 'Conflicting ranks'
              models[key] = model
          assert any(m['rank']==1 for m in models.values())
          meta = {'date':date,'observed':dt.date.today().isoformat(),'partial':False,'totalModels':len(models),'source':SOURCE,'sourceRevision':revision}
          print('MATH_META '+json.dumps(meta,separators=(',',':')))
          for model in sorted(models.values(), key=lambda m:(m['rank'],m['id'])):
              print('MATH_ROW '+json.dumps(model,separators=(',',':'),ensure_ascii=True))
          PY
