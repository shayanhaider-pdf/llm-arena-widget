name: Monthly Arena refresh and CI
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'AI-Radar.js'
      - 'refresh.py'
      - 'test_logic.py'
      - 'test_widget.cjs'
      - '.github/workflows/refresh.yml'
      - 'data/access.json'
      - 'data/widget.json'
      - 'data/latest.json'
      - 'data/alignment.json'
      - 'data/math.json'
  schedule:
    - cron: '17 5 1 * *'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest -v test_logic.py
      - run: node test_widget.cjs
  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: arena-refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'huggingface_hub>=0.28,<2' 'pyarrow>=18,<24'
      - run: python refresh.py
      - name: Verify published snapshot
        run: python -m unittest -v test_logic.py
      - name: Commit public ranks only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/widget.json
          if ! git diff --cached --quiet; then git commit -m 'Refresh Arena rankings'; git push; fi
