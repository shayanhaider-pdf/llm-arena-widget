name: Refresh Arena data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AI-Radar.js'
      - 'refresh.py'
      - 'test_logic.py'
      - 'test_widget.cjs'
      - '.github/workflows/refresh.yml'
  schedule:
    - cron: '0 5 * * *'
permissions:
  contents: write
concurrency:
  group: arena-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest -v test_logic.py
      - run: node test_widget.cjs
      - run: python refresh.py
      - name: Commit public ranks only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          if ! git diff --cached --quiet; then git commit -m 'Refresh Arena rankings'; git push; fi
