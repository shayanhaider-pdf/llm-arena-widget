name: Refresh Arena data
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
permissions:
  contents: write
concurrency:
  group: arena-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest test_logic.py
      - run: python refresh.py
      - name: Commit public ranks only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          if ! git diff --cached --quiet; then git commit -m 'Refresh Arena rankings'; git push; fi
